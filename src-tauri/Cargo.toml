[package]
name = "doova"
version = "0.5.2"
description = "Persoonlijke productiviteits-app voor macOS: tabs, to-do's, notities en bestanden"
authors = ["Roelof Junior Haar <bemboe09@gmail.com>"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "doova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-global-shortcut = "2"
base64 = "0.22"

# On-device dictation through Apple's Speech framework (see src/speech.rs).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSError",
  "NSLocale",
  "NSString",
  "NSObject",
] }
objc2-speech = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-avf-audio",
  "SFSpeechRecognizer",
  "SFSpeechRecognitionRequest",
  "SFSpeechRecognitionResult",
  "SFSpeechRecognitionTask",
  "SFTranscription",
] }
objc2-avf-audio = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "AVAudioBuffer",
  "AVAudioEngine",
  "AVAudioFormat",
  "AVAudioIONode",
  "AVAudioNode",
  "AVAudioTime",
  "AVAudioTypes",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSAttributedString",
  "NSGraphics",
  "NSParagraphStyle",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSTextList",
  "NSTextStorage",
  "NSWindow",
  "NSText",
  "NSTextView",
  "NSView",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "AVCaptureDevice",
  "AVMediaFormat",
] }

